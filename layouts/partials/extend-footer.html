{{ with site.Params.whatsapp }}
{{ $href := printf "https://wa.me/%s?text=%s" . (urlquery "السلام عليكم، عندي استفسار عن كتاب") }}

  <div class="wa-bubble" id="wa-bubble" role="status">
    <a class="wa-text" href="{{ $href | safeURL }}" target="_blank" rel="noopener">تبغى كتاب معين؟ كلّمنا على واتساب</a>
    <button type="button" class="wa-x" id="wa-x" aria-label="إغلاق">&times;</button>
  </div>
  <a class="wa-btn" href="{{ $href | safeURL }}" target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">

  </a>

<script>
(function () {
  var root = document.documentElement;

  /* Mouse light: page-wide and inside each card */
  addEventListener('pointermove', function (e) {
    root.style.setProperty('--mx', e.clientX + 'px');
    root.style.setProperty('--my', e.clientY + 'px');
    var card = e.target.closest ? e.target.closest('article') : null;
    if (card) {
      var r = card.getBoundingClientRect();
      card.style.setProperty('--cx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--cy', (e.clientY - r.top) + 'px');
    }
  }, { passive: true });

  /* Reveal cards as they scroll into view */
  if (!('IntersectionObserver' in window)) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        en.target.classList.add('show');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('article').forEach(function (el, i) {
    el.classList.add('js-reveal');
    el.style.setProperty('--d', ((i % 4) * 90) + 'ms');
    io.observe(el);
  });
})();
</script>

<script>
(function () {
  var box = document.getElementById('wa-float');
  if (!box) return;
  document.body.appendChild(box);

  var bubble = document.getElementById('wa-bubble');
  var closeBtn = document.getElementById('wa-x');
  var KEY = 'wa-bubble-closed';
  var closed = false;
  try { closed = sessionStorage.getItem(KEY) === '1'; } catch (e) {}

  /* The bubble pops up after 4 seconds unless it was closed in this visit */
  if (!closed) {
    setTimeout(function () { bubble.classList.add('show'); }, 4000);
  }

  closeBtn.addEventListener('click', function () {
    bubble.classList.remove('show');
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  });
})();
</script>
